name: Flood watch

# Checks whether GloFAS or any of the seven rain ensembles has published a new run and updates
# only then. GitHub's schedule starts it four times an hour; GitHub often delays or skips
# scheduled runs, so more slots mean fewer long gaps. An outside scheduler can also start it
# (workflow_dispatch) to make the timing regular.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch everything even if no model has a new run'
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: flood-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # each rain model's latest run, so an update only downloads the model that changed
      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: flood-cache-${{ github.run_id }}
          restore-keys: flood-cache-

      - name: Update forecasts when a model has a new run
        id: watch
        run: node flood-watch.mjs --out docs --cache .cache --archive ${{ inputs.force && ' ' || '--if-new' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_LEVEL: '1'

      - name: Save model cache
        if: steps.watch.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: flood-cache-${{ github.run_id }}

      - name: Open an issue for new or rising alerts
        if: steps.watch.outputs.updated == 'true' && steps.watch.outputs.new_alerts != '0'
        run: gh issue create --title "$(cat docs/data/alert-title.txt)" --body-file docs/data/bulletin.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish
        if: steps.watch.outputs.updated == 'true'
        run: |
          git config user.name "flood-watch-bot"
          git config user.email "flood-watch-bot@users.noreply.github.com"
          git add docs
          git commit -q -m "Forecast update $(date -u +'%F %H:%M') UTC" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      # a newer GloFAS version is live but has no thresholds yet: build them (at most every 6 hours)
      - name: Start threshold build for a new GloFAS version
        if: steps.watch.outputs.need_rebuild != ''
        run: |
          last=$(gh run list --workflow rebuild.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 21600 ]; then
            echo "A rebuild started less than 6 hours ago — not starting another."
          else
            gh workflow run rebuild.yml -f target="${{ steps.watch.outputs.need_rebuild }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
