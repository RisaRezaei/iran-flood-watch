name: Flood watch

# Checks every hour whether GloFAS (new run daily, out ~12:40 UTC) or the ECMWF ensemble
# (new run every 6 h, out ~9.5 h after its start) has published new data, and updates only then.
# A warning therefore appears within about an hour of the forecast that contains it.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch everything even if no model has a new run'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: flood-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update forecasts when a model has a new run
        id: watch
        run: node flood-watch.mjs --out docs --archive ${{ inputs.force && ' ' || '--if-new' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_LEVEL: '1'

      - name: Open an issue for new or rising alerts
        if: steps.watch.outputs.updated == 'true' && steps.watch.outputs.new_alerts != '0'
        run: gh issue create --title "$(cat docs/data/alert-title.txt)" --body-file docs/data/bulletin.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish
        if: steps.watch.outputs.updated == 'true'
        run: |
          git config user.name "flood-watch-bot"
          git config user.email "flood-watch-bot@users.noreply.github.com"
          git add docs
          git commit -m "Forecast update $(date -u +'%F %H:%M') UTC" || echo "nothing to commit"
          git push
